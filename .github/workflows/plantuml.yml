name: PlantUML CI/CD

on:
  push:
    paths:
      - "docs/**/*.puml"
      - "scripts/update_readme.py"
      - ".github/workflows/plantuml.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render PlantUML diagrams
        run: |
          mkdir -p images
          rm -f images/*.png images/*.svg
          chmod -R a+rwX images

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            ghcr.io/plantuml/plantuml \
            -tpng -o /workspace/images /workspace/docs

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            ghcr.io/plantuml/plantuml \
            -tsvg -o /workspace/images /workspace/docs

      - name: Update README
        run: |
          python scripts/update_readme.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: update PlantUML diagrams"
            git push
          fi
